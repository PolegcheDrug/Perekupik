<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор Перекупа — Telegram Mini App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #070a10;
            --bg-surface: #0e1420;
            --bg-card: rgba(18, 25, 38, 0.85);
            --bg-card-hover: rgba(26, 36, 54, 0.95);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 242, 254, 0.25);
            --cyan: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.4);
            --green: #00e676;
            --green-glow: rgba(0, 230, 118, 0.35);
            --amber: #ffb300;
            --amber-glow: rgba(255, 179, 0, 0.35);
            --red: #ff3366;
            --purple: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --radius-xl: 18px;
            --radius-lg: 14px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            height: 100%;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow: hidden;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 440px;
            margin: 0 auto;
            position: relative;
            background: radial-gradient(circle at 50% 0%, #131c2e 0%, var(--bg-body) 75%);
        }

        /* ШАПКА */
        .header-bar {
            flex-shrink: 0;
            background: rgba(14, 20, 32, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
        }

        .user-block { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), #3b82f6);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #fff; position: relative;
            box-shadow: 0 0 14px var(--cyan-glow);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .profile-avatar { width: 62px; height: 62px; margin: 0 auto; font-size: 26px; }
        .vip-tag {
            position: absolute; top: -3px; right: -3px;
            background: linear-gradient(135deg, #ffd700, var(--amber));
            color: #000; font-size: 8px; font-weight: 900;
            padding: 1px 5px; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .user-info .name {
            font-weight: 800; font-size: 13px;
            display: flex; align-items: center; gap: 6px;
        }
        .lvl-badge {
            font-size: 10px; background: rgba(0, 242, 254, 0.15); color: var(--cyan);
            padding: 1px 6px; border-radius: 5px; font-weight: 800; border: 1px solid var(--border-glow);
        }
        .xp-bar-wrap {
            width: 105px; height: 5px; background: rgba(255,255,255,0.08);
            border-radius: 10px; overflow: hidden; margin: 4px 0 2px 0;
        }
        .xp-bar-fill {
            height: 100%; width: 50%;
            background: linear-gradient(90deg, var(--cyan), var(--green));
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sub-stat { font-size: 10px; color: var(--text-sub); display: flex; gap: 6px; font-weight: 600; }

        .wallet-block { text-align: right; }
        .cash-text {
            color: var(--green); font-weight: 900; font-size: 15px;
            letter-spacing: 0.3px; text-shadow: 0 0 10px rgba(0,230,118,0.25);
        }
        .stars-text { color: var(--amber); font-weight: 700; font-size: 11px; margin: 1px 0; }
        .fuel-text {
            font-size: 10px; color: #38bdf8; font-weight: 700;
            display: flex; align-items: center; justify-content: flex-end; gap: 4px;
        }

        /* ВЕРХНИЕ ВКЛАДКИ */
        .sub-nav {
            flex-shrink: 0; display: flex; gap: 6px;
            overflow-x: auto; padding: 8px 14px; background: rgba(11, 15, 23, 0.85);
            scrollbar-width: none; border-bottom: 1px solid var(--border-glass);
        }
        .sub-nav::-webkit-scrollbar { display: none; }
        .sub-nav-btn {
            background: rgba(255,255,255,0.04); color: var(--text-sub);
            border: 1px solid var(--border-glass); padding: 7px 12px;
            border-radius: var(--radius-md); font-size: 11px; font-weight: 700;
            white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s ease;
        }
        .sub-nav-btn.active {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(59, 130, 246, 0.25));
            color: #fff; border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
        }

        /* ОСНОВНОЙ СКРОЛЛ-КОНТЕНТ */
        .main-content {
            flex: 1 1 auto; overflow-y: auto;
            -webkit-overflow-scrolling: touch; padding: 12px 14px 20px 14px;
            position: relative;
        }
        .tab-screen { display: none; }
        .tab-screen.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* КАРТОЧКИ GLASSMORPHISM */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 14px; margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            transition: border-color 0.2s;
        }
        .glass-card:hover { border-color: rgba(255,255,255,0.14); }

        .card-header-row { display: flex; justify-content: space-between; align-items: center; }
        .toggle-mode-box {
            display: flex; gap: 3px; background: #070b12;
            padding: 2px; border-radius: 8px; border: 1px solid var(--border-glass);
        }
        .mode-btn {
            background: transparent; color: var(--text-sub); border: none;
            font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; cursor: pointer;
        }
        .mode-btn.active { background: #0284c7; color: #fff; box-shadow: 0 0 8px rgba(2,132,199,0.4); }
        .mode-btn.bg-red.active { background: var(--red); color: #fff; box-shadow: 0 0 8px rgba(255,51,102,0.4); }

        /* КНОПКИ */
        .btn {
            width: 100%; padding: 11px; border-radius: var(--radius-md);
            border: none; font-weight: 800; font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            touch-action: manipulation; transition: all 0.15s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.35 !important; cursor: not-allowed; }
        .btn-cyan {
            background: linear-gradient(135deg, #0284c7, #00f2fe);
            color: #070d18; font-weight: 900;
            box-shadow: 0 4px 14px rgba(0,242,254,0.3);
        }
        .btn-green {
            background: linear-gradient(135deg, #059669, #00e676);
            color: #041208; font-weight: 900;
            box-shadow: 0 4px 14px rgba(0,230,118,0.25);
        }
        .btn-amber {
            background: linear-gradient(135deg, #d97706, var(--amber));
            color: #0f0a00; font-weight: 900;
            box-shadow: 0 4px 14px rgba(255,179,0,0.25);
        }
        .btn-dark {
            background: rgba(255,255,255,0.06); color: #e2e8f0;
            border: 1px solid var(--border-glass);
        }
        .btn-dark:hover { background: rgba(255,255,255,0.09); }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-sm { font-size: 10px; padding: 7px 0; }
        .btn-auto { width: auto; padding: 6px 12px; font-size: 11px; }

        /* ГРИДЫ */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-center-col { display: flex; flex-direction: column; align-items: center; }
        .flex-wrap-gap { display: flex; flex-wrap: wrap; gap: 6px; }
        .flex-gap { display: flex; gap: 6px; }

        /* КАРТОЧКА АВТО */
        .car-img-wrap {
            position: relative; width: 100%; height: 165px;
            border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 9px; background: #0c111c;
        }
        .car-img { width: 100%; height: 100%; object-fit: cover; }
        .badge-tag {
            position: absolute; top: 8px; left: 8px;
            background: rgba(8, 12, 20, 0.85); backdrop-filter: blur(8px);
            padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .plate-corner { position: absolute; bottom: 8px; right: 8px; }

        /* ГОСТ НОМЕР */
        .license-plate {
            background: #ffffff; color: #111111; font-family: monospace, sans-serif;
            border: 2px solid #000; border-radius: 4px; font-weight: 900;
            display: inline-flex; align-items: center; padding: 2px 6px; font-size: 11px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        .license-flag {
            border-left: 1px solid #111; padding-left: 4px; margin-left: 4px;
            font-size: 8px; display: flex; flex-direction: column; align-items: center; line-height: 1;
        }

        .price-box {
            background: rgba(0, 230, 118, 0.08); border: 1px solid rgba(0, 230, 118, 0.25);
            border-radius: var(--radius-md); padding: 8px 12px;
            display: flex; justify-content: space-between; align-items: center; margin: 8px 0;
        }
        .price-val { font-size: 16px; font-weight: 900; color: var(--green); }

        .level-gate-box {
            background: rgba(0,0,0,0.3); border: 1px dashed rgba(255, 179, 0, 0.35);
            border-radius: var(--radius-md); padding: 8px; margin-top: 8px;
        }

        /* ЧАТ СТРИТ */
        .chat-feed-box {
            max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
            background: #090e18; border: 1px solid var(--border-glass); border-radius: var(--radius-md);
            padding: 10px; margin-bottom: 8px;
        }
        .chat-msg {
            background: #121a28; padding: 7px 10px; border-radius: 8px; font-size: 11px;
            border-left: 3px solid var(--cyan);
        }
        .chat-msg.warning { border-left-color: var(--red); background: rgba(255, 51, 102, 0.12); }
        .chat-author { font-weight: 800; color: var(--cyan); margin-bottom: 2px; font-size: 10px; }

        /* ТАХОМЕТР И ГОНКИ */
        .warning-banner {
            background: rgba(255, 179, 0, 0.1); border: 1px solid rgba(255, 179, 0, 0.3);
            border-radius: 8px; padding: 8px 10px; font-size: 10px; display: flex; align-items: center; gap: 6px;
        }
        .race-panel {
            background: #080d16; border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg); padding: 14px; text-align: center;
        }
        .race-status { font-size: 11px; font-weight: 800; color: var(--amber); margin-bottom: 12px; }
        .tachometer-wrap {
            position: relative; width: 100%; height: 38px; background: #131b2a;
            border-radius: 8px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border-glass);
        }
        .tachometer-zone {
            position: absolute; left: 65%; width: 20%; height: 100%;
            background: rgba(0, 230, 118, 0.35); border-left: 2px solid var(--green); border-right: 2px solid var(--green);
            box-shadow: inset 0 0 10px rgba(0,230,118,0.3);
        }
        .tachometer-needle {
            position: absolute; top: 0; bottom: 0; left: 0; width: 4px;
            background: var(--red); border-radius: 2px; box-shadow: 0 0 8px var(--red);
        }

        .trophy-icon { font-size: 40px; margin-bottom: 4px; filter: drop-shadow(0 0 12px rgba(255,179,0,0.5)); }
        .tuning-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #0a0f19; border: 1px solid var(--border-glass); border-radius: 8px;
            padding: 8px 10px; margin-bottom: 6px;
        }
        .tuning-risk-meter { background: #0a0f19; border-radius: 8px; padding: 8px; }
        .risk-bar-wrap { width: 100%; height: 8px; background: #182232; border-radius: 6px; overflow: hidden; }
        .risk-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--green), var(--amber), var(--red)); transition: width 0.3s; }
        .police-badge { background: var(--red); color: #fff; font-weight: 900; font-size: 12px; text-align: center; padding: 5px; border-radius: 6px; }

        .wheel-container { position: relative; width: 240px; height: 240px; margin-bottom: 16px; }
        .wheel-pointer {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            color: var(--amber); font-size: 26px; z-index: 5; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
        }

        .sub-pass-card {
            background: linear-gradient(135deg, rgba(255, 179, 0, 0.12), rgba(168, 85, 247, 0.12));
            border: 1px solid rgba(255, 179, 0, 0.35);
            border-radius: var(--radius-xl); padding: 14px; margin-bottom: 12px;
        }

        /* МОДАЛКИ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #0f1624; border: 1px solid var(--border-glow); border-radius: var(--radius-xl);
            width: 100%; max-width: 360px; padding: 18px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 16px 40px rgba(0,0,0,0.8);
        }
        .border-red { border-color: var(--red) !important; }
        .report-box { background: #080d16; padding: 10px; border-radius: 8px; font-size: 12px; border: 1px solid var(--border-glass); }
        .haggle-bubble { background: #080d16; padding: 10px; border-radius: 8px; font-size: 11px; font-style: italic; border: 1px solid var(--border-glass); }

        /* ВСПЛЫВАЮЩИЙ ТОСТ */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #111a2a; border: 1px solid var(--cyan); color: #fff;
            padding: 10px 20px; border-radius: 30px; font-size: 12px; font-weight: 800;
            z-index: 2000; transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,242,254,0.3); white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ПЛАВАЮЩИЙ ИНДИКАТОР ВЫРУЧКИ */
        .floating-reward {
            position: fixed; font-weight: 900; font-size: 16px;
            color: var(--green); text-shadow: 0 0 10px rgba(0,230,118,0.8);
            pointer-events: none; z-index: 3000;
            animation: floatUpFade 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes floatUpFade {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -15px) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
        }

        /* НИЖНЕЕ МЕНЮ */
        .bottom-nav {
            flex-shrink: 0; height: 60px; background: rgba(14, 20, 32, 0.98);
            border-top: 1px solid var(--border-glass); display: flex;
            justify-content: space-around; align-items: center; z-index: 25;
            backdrop-filter: blur(16px);
        }
        .b-nav-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 3px; color: var(--text-sub); font-size: 10px; font-weight: 700;
            cursor: pointer; width: 20%; touch-action: manipulation; transition: color 0.15s;
        }
        .b-nav-item i { font-size: 17px; }
        .b-nav-item.active { color: var(--cyan); text-shadow: 0 0 10px var(--cyan-glow); }

        .color-cyan { color: var(--cyan); }
        .color-green { color: var(--green); }
        .color-amber { color: var(--amber); }
        .color-red { color: var(--red); }
        .color-purple { color: var(--purple); }
        .border-green { border-color: var(--green); }
        .sub-label { font-size: 11px; color: var(--text-sub); }
        .font-bold { font-weight: 800; }
        .mb-1 { margin-bottom: 4px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mt-1 { margin-top: 4px; }
        .mt-2 { margin-top: 8px; }
        .text-center { text-align: center; }
        .text-xs { font-size: 10px; }
        .opacity-50 { opacity: 0.5; }
        .tag-badge { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; border: 1px solid transparent; }
        .bg-tag-cyan { background: #06283d; color: var(--cyan); border-color: var(--border-glow); }
        .bg-tag-purple { background: #3b0764; color: var(--purple); }
        .bg-tag-red { background: #450a0a; color: var(--red); }
        .pack-btn { flex-direction: column; align-items: flex-start; padding: 10px; }
        .inspect-part-btn { flex-direction: column; align-items: flex-start; padding: 8px; }
        .stat-box { background: #090e18; padding: 8px; border-radius: 8px; border: 1px solid var(--border-glass); }
        .stat-value { font-size: 14px; font-weight: 900; }
        .my-club-card { background: #090e18; border: 1px solid var(--border-glass); border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .clubs-list { display: flex; flex-direction: column; gap: 6px; }
        .club-item { padding: 10px; display: flex; justify-content: space-between; align-items: center; margin: 0; }
        .legal-warning { background: rgba(220, 38, 38, 0.15); border: 1px solid var(--red); border-radius: 8px; padding: 6px 10px; font-size: 11px; color: #fca5a5; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .tuning-badge { background: #1e1b4b; border: 1px solid #6366f1; color: #a5b4fc; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-shell">

        <!-- ВЕРХНЯЯ ШАПКА -->
        <header class="header-bar">
            <div class="user-block">
                <div class="avatar">
                    <i class="fa-solid fa-user-ninja"></i>
                    <span id="vipBadge" class="vip-tag" style="display:none;">VIP</span>
                </div>
                <div class="user-info">
                    <div class="name">
                        <span id="playerName">Перекуп #777</span>
                        <s
